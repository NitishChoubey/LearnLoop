services:
  - type: web
    name: learnloop-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: learnloop-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_EMBEDDING_MODEL
        value: text-embedding-004
      - key: AI_MATCH_MAX_TUTORS
        value: 300
      - key: AI_MATCH_MIN_TOPIC_SIMILARITY
        value: 0.35
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false

  - type: web
    name: learnloop-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run preview -- --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: VITE_API_URL
        value: https://learnloop-api.onrender.com

databases:
  - name: learnloop-db
    plan: free
    databaseName: learnloop
    user: learnloop
