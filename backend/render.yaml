services:
  - type: web
    name: learnloop-api
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: learnloop-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://learnloop.netlify.app
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false

databases:
  - name: learnloop-db
    plan: free
    databaseName: learnloop
    user: learnloop
